services:
  - type: web
    name: paypilot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: paypilot-db
          property: connectionString

databases:
  - name: paypilot-db
    plan: free
